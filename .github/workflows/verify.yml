name: Verify Contour
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.7'
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          version: 11.19.0
          runtime: node@22.23.1
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir design/design-system/site install --frozen-lockfile
      - run: python -m pip install playwright==1.61.0 defusedxml==0.7.1
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/build.py
      - name: Reject stale generated files
        run: git diff --exit-code
      - run: python scripts/check.py --browser
      - name: Type-check catalog and React contracts
        run: pnpm --dir design/design-system/site run typecheck
      - name: Build immutable release bundle
        run: python scripts/pack.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: contour-release
          path: dist/contour-v*.zip*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: core
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: contour-release
          path: dist
      - name: Publish only a matching, verified stable version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c 'import json; print(json.load(open("package.json"))["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Contour $version" --notes-file docs/release-notes.md
