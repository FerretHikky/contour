<div class="rf-text-field-group">
  <span class="rf-text-field__control">
    <input class="rf-text-field rf-text-field--with-action rf-date-picker" id="textfield-date" type="date" placeholder=" "  autocomplete="off" data-rf-autofill="off" aria-describedby="textfield-date-hint">
    <label class="rf-text-field__label" for="textfield-date">Дата</label>
    <span class="rf-text-field__action">
      <button class="rf-text-field__action-trigger" type="button" data-rf-date-trigger aria-label="Открыть календарь">
        <span class="rf-icon rf-icon--sm" data-rf-icon-glyph="calendar" aria-hidden="true"></span>
      </button>
    </span>
  </span>
  <span class="rf-text-field__hint" id="textfield-date-hint">Выберите дату</span>
</div>
