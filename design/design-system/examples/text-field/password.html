<div class="rf-text-field-group">
  <span class="rf-text-field__control">
    <input class="rf-text-field rf-text-field--with-action" id="textfield-password" type="password" placeholder=" " autocomplete="current-password" data-rf-password-field aria-describedby="textfield-password-hint">
    <label class="rf-text-field__label" for="textfield-password">Пароль</label>
    <span class="rf-text-field__action">
      <button class="rf-text-field__action-trigger" type="button" data-rf-password-toggle data-rf-password-show-label="Показать пароль" data-rf-password-hide-label="Скрыть пароль" aria-label="Показать пароль" aria-controls="textfield-password" aria-pressed="false">
        <span class="rf-icon rf-icon--sm" data-rf-icon-glyph="eye" aria-hidden="true"></span>
      </button>
    </span>
  </span>
  <span class="rf-text-field__hint" id="textfield-password-hint">Введите пароль</span>
</div>
