<div class="rf-text-field-group">
  <span class="rf-text-field__control">
    <input class="rf-text-field rf-text-field--with-suffix" id="textfield-price" type="text" inputmode="decimal" data-rf-price pattern="[0-9]+([.,][0-9]{1,2})?" placeholder=" " autocomplete="off" data-rf-autofill="off" aria-describedby="textfield-price-currency textfield-price-hint">
    <label class="rf-text-field__label" for="textfield-price">Цена</label>
    <span class="rf-text-field__suffix" id="textfield-price-currency" data-rf-currency="RUB">₽</span>
  </span>
  <span class="rf-text-field__hint" id="textfield-price-hint">Укажите сумму</span>
</div>
