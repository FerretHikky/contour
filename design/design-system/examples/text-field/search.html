<div class="rf-text-field-group">
  <span class="rf-text-field__control">
    <span class="rf-text-field__icon rf-icon rf-icon--sm" data-rf-icon-glyph="search" aria-hidden="true"></span>
    <input class="rf-text-field rf-text-field--with-icon rf-text-field--with-action" id="textfield-search" type="search" placeholder=" " value="Пионы" autocomplete="off" data-rf-autofill="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-describedby="textfield-search-hint">
    <label class="rf-text-field__label" for="textfield-search">Поиск</label>
    <span class="rf-text-field__action">
      <button class="rf-text-field__action-trigger" type="button" data-rf-input-clear aria-label="Очистить поиск" hidden>
        <span class="rf-icon rf-icon--sm" data-rf-icon-glyph="close" aria-hidden="true"></span>
      </button>
    </span>
  </span>
  <span class="rf-text-field__hint" id="textfield-search-hint">Введите поисковый запрос</span>
</div>
